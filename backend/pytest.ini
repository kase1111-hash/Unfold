[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_neo4j: needs a reachable Neo4j (skipped otherwise)
    requires_no_neo4j: checks behaviour when Neo4j is down (skipped when it is up)
